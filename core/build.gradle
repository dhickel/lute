[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  implementation "tools.jackson.core:jackson-databind:3.3.0"
  api "com.badlogicgames.ashley:ashley:1.7.4"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-ai:1.8.2"
  api "com.crashinvaders.vfx:gdx-vfx-core:$gdxVfxCoreVersion"
  api "com.crashinvaders.vfx:gdx-vfx-effects:$gdxVfxEffectsVersion"
  api "com.github.libgdx:box2dlights:$box2dlightsVersion"

  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test') {
  failOnNoDiscoveredTests = false
}

tasks.register('inputSystemTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'io.mindspice.lute.engine.input.InputSystemTest'
}
check.dependsOn inputSystemTest

tasks.register('manifestLoaderTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'io.mindspice.lute.engine.assets.tiled.ManifestLoaderTest'
  workingDir = rootProject.projectDir
}
check.dependsOn manifestLoaderTest

tasks.register('tiledAnimationPropertiesTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'io.mindspice.lute.engine.tiled.TiledAnimationPropertiesTest'
  workingDir = rootProject.projectDir
}
check.dependsOn tiledAnimationPropertiesTest

tasks.register('combatSystemTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath + files(rootProject.file('assets'))
  mainClass = 'io.mindspice.lute.engine.combat.CombatSystemTest'
  workingDir = rootProject.projectDir
}
check.dependsOn combatSystemTest

tasks.register('triggerDebugRenderSystemTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'io.mindspice.lute.engine.systems.TriggerDebugRenderSystemTest'
  workingDir = rootProject.projectDir
}
check.dependsOn triggerDebugRenderSystemTest
